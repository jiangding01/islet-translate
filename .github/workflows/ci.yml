name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # New or upgraded dependencies in a pull request: a known high-severity issue blocks.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps never get a token that can push to the repository.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dependencies that ship inside the extension: a known high-severity issue blocks, except
      # advisories listed (by ID, with a reason and an expiry) in scripts/audit-allowlist.json.
      - name: Audit runtime dependencies
        run: node scripts/check-audit.mjs
      # Build and test tools: reported only, since a fix often waits on upstream.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Verify registry signatures
        run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      # UI copy: locale files agree, and no new hard-coded Chinese beyond scripts/i18n-baseline.json.
      - run: npm run check:i18n
      - run: npm run check:contrast
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:size
      # The verified build, ready to load: download it from the run's Summary page,
      # unzip, then "Load unpacked" in chrome://extensions.
      - name: Upload the built extension
        uses: actions/upload-artifact@v7
        with:
          name: islet-translate-chrome-${{ github.sha }}
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 7

  # Smoke e2e: the built extension in a real Chrome for Testing (docs/plans/e2e-smoke.md).
  # Required in the main ruleset since 2026-11-20 (13 consecutive green runs with no retries).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The build the check job verified, so the tests run against exactly that output.
      - name: Download the built extension
        uses: actions/download-artifact@v8
        with:
          name: islet-translate-chrome-${{ github.sha }}
          path: .output/chrome-mv3
      # Pinned to the v2.2.0 commit. An exact version makes the action install Chrome for Testing
      # (branded Chrome 137+ ignores --load-extension). Upgrade the version by hand.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 158.0.8127.36
          # Installs the system libraries Chrome needs on the runner image.
          install-dependencies: true
      - name: Run smoke e2e
        run: npm run test:e2e
        env:
          CI: true
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Not on cancel: a test that failed and then passed on retry leaves artifacts too.
      - name: Upload e2e failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ github.sha }}
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
