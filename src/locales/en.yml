# The placeholder where a paragraph failed to translate (src/content/render.ts).
render:
  failed: Not translated
  retry: Retry
  # A paragraph too long to translate is not sent; this note stays in its place.
  skipped: Too long to translate

# The command palette (src/content/palette), opened with the open-palette shortcut.
palette:
  # The dialog's accessible name.
  label: Command palette
  placeholder: Type a command
  empty: No matching commands
  retryFailed: Retry failed paragraphs
  # Shown while the whole page is translated; opens the list of engines. Must end with "…"
  # in every locale: the engine list's breadcrumb shows it with that "…" removed.
  switchEngine: Switch translation service…
  # Shown when the page is not translated; the engine is picked next.
  translateWith: Translate this page with…
