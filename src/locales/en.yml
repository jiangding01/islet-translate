popup:
  loading: Loading…
  browserPage: Browser page
  # $1: the page language's own name (never translated).
  detected: "Detected: $1"
  noLanguage: No language declared
  translateTo: Translate to
  # $1: the page language's own name.
  nativeTitle: This page is already in $1
  nativeHint: No translation needed.
  reloadTitle: Reload this page
  reloadHint: Pages opened before the extension was installed or updated need a reload before they can be translated.
  blockedTitle: This page can't be translated
  blockedHint: Browsers don't let extensions read their own pages or the Web Store. Try a regular web page.
  readingPage: Reading the page…
  alwaysSite: Always translate this site
  # $1: the site's host name.
  alwaysOn: Translates automatically on $1
  alwaysOff: Translates only when you ask
  settings: Settings
  goSettings: Open Settings
  translatePage: Translate this page
  translateAnyway: Translate anyway
  noShortcut: No shortcut yet ·
  setShortcut: Set a shortcut ↗
  # $1: the default engine's name, $2: why it cannot translate yet (engine.notReady.*).
  engineNotReady: "$1: $2"
  # $1: the engine's name, $2: why it paused (popup.pausedReason.*).
  pausedNotice: "$1: $2. Translation paused."
  pausedReason:
    unauthorized: invalid API key
    quotaExceeded: quota used up
    localRejected: the local service refused the request
    permissionMissing: access to the API URL not granted
    incomplete: setup incomplete
  showOriginal: Show original
  stopShowOriginal: Stop and show original
  progress: Translating what's on screen; more as you scroll
  # $1: the number of paragraphs not translated.
  failedCount:
