# The page isle (src/content/isle) and the render placeholder (src/content/render.ts).
isle:
  toolbar: Translation controls
  modes: Display mode
  modeBilingual: Bilingual
  modeTranslation: Translation only
  modeOriginal: Show original (ends this translation)
  # The single-character mode buttons show these only when the UI language is Chinese;
  # other languages draw an icon (the isle's MODE_ICONS) and do not display these.
  glyphBilingual: B
  glyphTranslation: T
  glyphOriginal: O
  engines: Engine for this page
  listTitle: Engine for this translation
  listNote: Doesn't change your default
  listFailed: Couldn't load the engine list
  started: Translation started
  finished: Translation finished
  # $1: the main sentence (e.g. "Translation finished"), $2: an added note.
  withNote: "$1. $2"
  # $1: the number of paragraphs not translated.
  retryCount:
    1: Retry $1 paragraph that wasn't translated
    n: Retry $1 paragraphs that weren't translated
  # $1: the engine's name, $2: why it failed.
  engineError: "Engine for this page: $1 ($2)"
  # $1: the engine's name.
  engineSwitch: "Engine for this page: $1 (click to switch)"

