  # 灵岛里无名自定义服务的名称（不回退到主机名）。
  customFallback: 自定义服务
  # 无名自定义服务的简称（有名字时取名字前两个字符）。
  unnamedShort: 自
  notReady:
    badUrl: 地址格式不正确
    needsGrant: 还没有授权访问这个地址
    needsKey: 还没有填写密钥
    needsModel: 还没有填写模型
  status:
    free: 免费
    # $1：密钥末 4 位。
    keySuffix: 密钥 ••••$1
    keyConfigured: 已配置密钥
    badUrl: 地址有误
    needsGrant: 待授权
    noKey: 未填密钥
    notConfigured: 未配置
    noModel: 未填模型
    unsaved: 未保存

