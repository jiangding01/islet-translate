  noLanguage: 未宣告語言
  translateTo: 翻譯成
  # $1：頁面語言的自稱。
  nativeTitle: 這一頁已經是$1
  nativeHint: 不需要翻譯。
  reloadTitle: 需要重新整理這個網頁
