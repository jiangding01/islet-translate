  autoDetect: 自動偵測
  modeBilingual: 雙語
  modeTranslation: 僅譯文
  # $1：Google 引擎的名稱（engine.googleName）。
  useGoogleOnce: 這次先用 $1
  retry: 重試
  # $1：過長而沒有翻譯的段數。
  skippedCount:
    1: $1 段過長，未翻譯
    n: $1 段過長，未翻譯

