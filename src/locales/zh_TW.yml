# 繁體中文（台灣）介面文案。鍵名與 en.yml 完全一致，規則見 en.yml 頂部與 docs/plans/i18n.md。

meta:
  locale: zh-TW

manifest:
  name: 譯嶼
  shortName: 譯嶼
  description: 雙語網頁閱讀：整頁、反白、單字翻譯。
  actionTitle: 譯嶼
  commands:
    translatePage: 翻譯此頁 / 顯示原文
    translateSelection: 翻譯選取文字
    openPalette: 開啟指令台

# 錯誤文案（src/lib/error-messages.ts 的錯誤碼 → 鍵表；內容端 src/content/error-text.ts 複用其中 3 條）。
# 寫法：發生了什麼 + 怎麼辦。
errors:
  generic: 操作失敗，請重試。
  config:
    newerVersion: 設定由較新版本的擴充功能寫入，目前版本無法修改。請更新擴充功能。
    writeFailed: 儲存失敗，請重試。
    readFailed: 讀取設定失敗，請重新整理後重試。
    invalidBaseUrl: API 網址不正確。請填寫 https 開頭的網址，本機模型可用 http://localhost。
    modelRequired: 尚未填寫模型名稱。請填寫模型後重試。
    permissionMissing: 尚未授權存取該 API 網址。請在設定頁點選「授權存取」後重試。
    providerLimit: 自訂服務已達 10 個上限。請先刪除不用的服務。
    providerMissing: 找不到這個自訂服務，可能已被刪除。請在設定頁重新選擇預設引擎。
    invalidValue: 設定值不正確，未儲存。請檢查後重試。
  network:
    extensionUnreachable: 無法連線到擴充功能背景程式，請重新載入擴充功能後重試。
    pageUnreachable: 無法連線到頁面，請重新整理網頁後重試。Chrome 線上應用程式商店等受限頁面無法使用。
    fetchFailed: 無法連線翻譯服務。請檢查網路後重試。
    timeout: 翻譯服務回應逾時。請檢查網路後重試。
    streamInterrupted: 翻譯過程中連線中斷。請重試。
  validation:
    payloadTooLarge: 一次送出的內容過多。請縮小翻譯範圍後重試。
    emptyTranslation: 翻譯服務傳回了空白結果。請重試，或換一個翻譯服務。
    invalidPayload: 請求格式不正確。請重新整理頁面後重試。
    forbiddenSender: 該操作只能在設定頁中進行。請從設定頁重試。
    invalidSecret: 金鑰格式不正確：只能包含英文字母、數字和符號，不能有空格，且不超過 512 個字元。請重新複製後再貼上。
    badResponse: 翻譯服務傳回的內容無法解析。請重試，或換一個翻譯服務。
    unsupportedPage: 請在一般 HTTP 或 HTTPS 網頁中開啟擴充功能。
  provider:
    unauthorized: 金鑰無效或沒有存取權限。請檢查金鑰後重試。
    localOriginRejected: 本機服務拒絕了擴充功能的請求。如果是 Ollama，需要把環境變數 OLLAMA_ORIGINS 設為 chrome-extension://*，再完全結束並重新開啟 Ollama。
    notFound: API 網址或模型不存在。請檢查 API 網址和模型名稱。
    quotaExceeded: 該服務的額度已用完。請儲值，或換一個翻譯服務。
    serverError: 翻譯服務暫時發生錯誤。請稍後重試，或換一個翻譯服務。
    outputTruncated: 譯文超出模型的輸出長度，被截斷了。請縮小翻譯範圍，或換一個模型。
    contentBlocked: 這段內容被翻譯服務的安全政策攔截，無法翻譯。
    badRequest: 翻譯服務拒絕了該請求。請檢查模型名稱等設定後重試。
  rateLimit:
    tooManyRequests: 請求過於頻繁，服務暫時限制了請求頻率。請稍候片刻後重試。
    portBusy: 目前頁面同時進行的翻譯請求過多。請稍候片刻後重試。
  action:
    panelReadFailed: 讀取設定失敗，請重新開啟面板。
    openSettingsFailed: 無法開啟設定頁，請重試。
    addFailed: 新增失敗，請重試。
    clearFailed: 清除失敗，請重試。
    deleteFailed: 刪除失敗，請重試。
    connectFailed: 連線失敗，請重試。

# 引擎名稱與就緒狀態（src/lib/engine-view.ts、src/lib/translate/engine-options.ts）。
engine:
  googleName: Google 翻譯
  # 設定頁和面板裡未命名自訂服務的名稱（有網址時顯示主機名稱）。
  unnamed: 未命名服務
  # 靈島裡未命名自訂服務的名稱（不回退到主機名稱）。
  customFallback: 自訂服務
  # 未命名自訂服務的簡稱（有名稱時取名稱前兩個字元）。
  unnamedShort: 自
  notReady:
    badUrl: 網址格式不正確
    needsGrant: 還沒有授權存取這個網址
    needsKey: 還沒有填寫金鑰
    needsModel: 還沒有填寫模型
  status:
    free: 免費
    # $1：金鑰末 4 碼。
    keySuffix: 金鑰 ••••$1
    keyConfigured: 已設定金鑰
    badUrl: 網址有誤
    needsGrant: 待授權
    noKey: 未填金鑰
    notConfigured: 未設定
    noModel: 未填模型
    unsaved: 未儲存

# 面板、設定頁與內容模組共用、意思完全相同的詞。
